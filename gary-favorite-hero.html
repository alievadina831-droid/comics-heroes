<h1>Человек-паук (Spider-Man)</h1>
<р>Питер Паркер: қарапайым окушы, өрмекшінің шағуынан кейін ерекше кушке ие болды. </р>
<р>Ерекшеліктері: тор шашады, қабырғамен жүре алады, кауіпті сезеді .</р>
<р>Неге ұнайды: ол қиын кезде де басқаларға кемектесіп, жауапкершілікті сезінеді. </р>
