  <h1>Человек-паук (Spider-Man)</h1>
  <p>Питер Паркер: қарапайым оқушы, өрмекшінің шағуынан кейін ерекше күшке ие болды.</p>
  <p>Ерекшеліктері: тор шашады, қабырғамен жүре алады, қауіпті сезеді.</p>
  <p>Неге ұнайды: ол қиын кезде де басқаларға көмектесіп, жауапкершілікті сезінеді.</p>
